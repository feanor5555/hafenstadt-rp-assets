<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 96 96">
  <title>Hafenstadt RP</title>
  <defs>
    <filter id="glowMagenta" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feFlood flood-color="#FF4FA3" flood-opacity="0.55"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feFlood flood-color="#5CE1FF" flood-opacity="0.45"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="night" cx="50%" cy="30%" r="75%">
      <stop offset="0" stop-color="#16121F"/>
      <stop offset="1" stop-color="#07070B"/>
    </radialGradient>
  </defs>
  <rect x="0.5" y="0.5" width="95" height="95" rx="22" fill="url(#night)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/><path d="M22 1.5 H74" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
    <g filter="url(#glowMagenta)">
      <g fill="#FF4FA3">
        <rect x="36" y="24" width="9" height="48" rx="2"/>
        <rect x="66" y="24" width="9" height="48" rx="2"/>
        <rect x="6" y="34" width="80" height="8" rx="2.5"/>
      </g>
      <g fill="none" stroke="#FF4FA3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M40.5 26 L55.5 11 L70.5 26" stroke-width="4.5"/>
        <path d="M55.5 11 L10 34" stroke-width="2.5"/>
      </g>
    </g>
    <rect x="17" y="42" width="2" height="9" fill="#F5F5F7"/>
    <rect x="9" y="51" width="18" height="11" rx="1.5" fill="#F5F5F7"/>
    <g fill="none" stroke="#5CE1FF" stroke-width="3.5" stroke-linecap="round" filter="url(#glowCyan)">
      <path d="M18 81 q7.5 -4 15 0 t15 0 t15 0 t15 0"/>
      <path d="M30 88.5 q6 -3.2 12 0 t12 0 t12 0" stroke-opacity="0.6"/>
    </g>
</svg>
